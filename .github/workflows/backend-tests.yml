name: Backend tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Verify database is not bundled
        run: |
          if (Test-Path sentinelti.db) {
            throw 'sentinelti.db must not be tracked in Git.'
          }
      - name: Run tests
        env:
          SENTINELTI_API_KEY: sentinelti-ci-test-key-not-for-production
        run: python -m pytest -q
      - name: Initialize database from scratch
        run: python -m sentinelti.cli init
